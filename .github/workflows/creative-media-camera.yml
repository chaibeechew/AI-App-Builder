name: Creative Media Cinema Camera Engine

on:
  push:
    branches:
      - 'batch123-*'
    paths:
      - 'lib/video/cinema-camera-engine.js'
      - 'lib/video/generation-gateway.js'
      - 'scripts/creative-media-camera-contract-tests.mjs'
      - '.github/workflows/creative-media-camera.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/video/cinema-camera-engine.js'
      - 'lib/video/generation-gateway.js'
      - 'scripts/creative-media-camera-contract-tests.mjs'
      - '.github/workflows/creative-media-camera.yml'

jobs:
  camera-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Cinema camera contract
        run: node scripts/creative-media-camera-contract-tests.mjs
      - name: Creative Media control-plane regression
        run: node scripts/creative-media-control-plane-contract-tests.mjs
      - name: Creative Media quality regression
        run: node scripts/creative-media-quality-runtime-contract-tests.mjs
      - name: AI Video regression
        run: npm run test:video
      - name: Image Studio regression
        run: npm run test:image-studio
      - name: AI Avatar regression
        run: npm run test:avatar
      - name: Truth boundary
        run: echo 'Camera CODE/CI capability does not imply provider support, Production LIVE generation, or verified cinematic output quality.'
