name: LANERIQ Complete 18-Page LIUI Surface Gate

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/product/laneriq-18-page-master.js"
      - "scripts/production-mobile-browser-qa.mjs"
      - "scripts/batch41-liui-complete-18-page-surface-tests.mjs"
      - ".github/workflows/liui-complete-18-page-surface-gate.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/product/laneriq-18-page-master.js"
      - "scripts/production-mobile-browser-qa.mjs"
      - "scripts/batch41-liui-complete-18-page-surface-tests.mjs"
      - ".github/workflows/liui-complete-18-page-surface-gate.yml"

permissions:
  contents: read

jobs:
  complete-liui-surface-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      LANERIQ_EVIDENCE_LEVEL: CODE_CI_ONLY
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate complete 18-page LIUI contract
        run: node scripts/batch41-liui-complete-18-page-surface-tests.mjs

      - name: Build runtime integration
        run: npm run build

      - name: Evidence boundary
        run: |
          echo "✓ Batch 41 gate proves CODE + CI + build integration only."
          echo "✓ It does not prove LIVE_PROVIDER, PHYSICAL_DEVICE or OFFICIAL_STORE status."
          echo "✓ Production exact SHA + mobile browser/runtime evidence remains a post-merge requirement."
