name: LANERIQ AI 100 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          dir="supabase/migrations"
          test -d "$dir"
          files=("$dir"/*.sql)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            base="$(basename "$file")"
            if [[ ! "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "Invalid migration filename: $base"
              exit 1
            fi
            if [[ ! -s "$file" ]]; then
              echo "Empty migration: $base"
              exit 1
            fi
          done
          duplicates=$(printf '%s\n' "${files[@]}" | sed 's#^.*/##' | cut -d_ -f1 | sort | uniq -d || true)
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate migration timestamps:"
            echo "$duplicates"
            exit 1
          fi
          echo "Migration filename validation passed."
      - name: LANERIQ AI brand regression tests
        run: npm run test:brand
      - name: Release policy regression tests
        run: npm run test:release
      - name: Security and ownership contract tests
        run: npm run test:security
      - name: Credits and entitlement contract tests
        run: npm run test:credits
      - name: Pro Mode contract tests
        run: npm run test:pro
      - name: Game commercial policy contract tests
        run: npm run test:game-commercial
      - name: Game Creator runtime contract tests
        run: npm run test:game-runtime
      - name: Multiplayer and 5v5 contract tests
        run: npm run test:multiplayer
      - name: Version History and Undo contract tests
        run: npm run test:versions
      - name: Database and Supabase contract tests
        run: npm run test:database
      - name: Project Memory contract tests
        run: npm run test:memory
      - name: Brand Kit contract tests
        run: npm run test:brand-kit
      - name: Automation and Workflows contract tests
        run: npm run test:workflows
      - name: AI Self-Test and Self-Heal contract tests
        run: npm run test:self-heal
      - name: AI Modify contract tests
        run: npm run test:modify
      - name: AI Idea Planning contract tests
        run: npm run test:idea
      - name: Templates contract tests
        run: npm run test:templates
      - name: Multilingual contract tests
        run: npm run test:i18n
      - name: Account and Session Safety contract tests
        run: npm run test:account
      - name: Email OTP contract tests
        run: npm run test:email-otp
      - name: Upload Ref contract tests
        run: npm run test:upload-ref
      - name: Image Studio contract tests
        run: npm run test:image-studio
      - name: AI Video Generator contract tests
        run: npm run test:video
      - name: AI Avatar Creator contract tests
        run: npm run test:avatar
      - name: Web Publish contract tests
        run: npm run test:web-publish
      - name: Apple App Store contract tests
        run: npm run test:apple-store

      # 1000-point hardening pack: ten previously unscored production/code areas.
      - name: Publishing readiness contract tests
        run: npm run test:publishing-readiness
      - name: SEO foundation contract tests
        run: npm run test:seo
      - name: Vercel function budget contract tests
        run: npm run test:vercel-budget
      - name: Project readiness contract tests
        run: npm run test:project-readiness
      - name: Mobile game platform contract tests
        run: npm run test:mobile-game
      - name: AAA mobile production contract tests
        run: npm run test:aaa-mobile
      - name: Advanced 3D gameplay contract tests
        run: npm run test:advanced-3d
      - name: Advanced game genres contract tests
        run: npm run test:advanced-genres
      - name: Content production pipeline contract tests
        run: npm run test:content-pipeline
      - name: Complete game creation contract tests
        run: npm run test:complete-game

      - name: Runtime reliability contract tests
        run: npm run test:runtime
      - name: Non-production 100 product contract tests
        run: npm run test:nonprod
      - name: 100-point structural readiness gate
        run: npm run quality:100
      - name: Build Next.js application
        run: npm run build
      - name: Report
        run: echo "LANERIQ AI core gates plus the 1000-point hardening pack passed. Live provider, phone and store evidence remain separately evidence-gated."
      # This workflow validates code only. It never deploys or promotes Production.
