name: LANERIQ AI 100 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          dir="supabase/migrations"
          test -d "$dir"
          files=("$dir"/*.sql)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            base="$(basename "$file")"
            if [[ ! "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "Invalid migration filename: $base"
              exit 1
            fi
            if [[ ! -s "$file" ]]; then
              echo "Empty migration: $base"
              exit 1
            fi
          done
          duplicates=$(printf '%s\n' "${files[@]}" | sed 's#^.*/##' | cut -d_ -f1 | sort | uniq -d || true)
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate migration timestamps:"
            echo "$duplicates"
            exit 1
          fi
          echo "Migration filename validation passed."
      - name: Release policy regression tests
        run: npm run test:release
      - name: Security and ownership contract tests
        run: npm run test:security
      - name: Runtime reliability contract tests
        run: npm run test:runtime
      - name: Non-production 100 product contract tests
        run: npm run test:nonprod
      - name: Premium per-page visual and iPhone contract tests
        run: npm run test:visual
      - name: Publishing Agent readiness tests
        run: npm run test:publishing
      - name: 100-point structural readiness gate
        run: npm run quality:100
      - name: Build Next.js application
        run: npm run build
      - name: Report
        run: echo "100-point code/product validation passed. Production promotion remains a separate explicitly approved action."
      # This workflow validates code only. It never deploys or promotes Production.
