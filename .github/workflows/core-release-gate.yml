name: 0 - LANERIQ Core Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: laneriq-core-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      LANERIQ_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      GEMINI_API_KEY: ci-placeholder
      LANERIQ_EVIDENCE_LEVEL: CODE_CI_ONLY

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.LANERIQ_CANDIDATE_SHA }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$LANERIQ_CANDIDATE_SHA"
          echo "Exact candidate SHA: $actual"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies once
        run: npm ci --no-audit --no-fund

      - name: Validate Core Release Gate contract
        run: node scripts/core-release-gate-contract-tests.mjs

      - name: Core 1/6 — Cloud boundary
        run: node services/cloud/test/contract.mjs

      - name: Core 2/6 — Generation boundary
        run: node services/generation/test/contract.mjs

      - name: Core 3/6 — Zero-cost and provider safety
        run: npm run test:zero-cost

      - name: Core 4/6 — Production evidence attestation
        run: node scripts/production-evidence-attestation-contract-tests.mjs

      - name: Core 5/6 — Immutable evidence ledger and replay
        run: node scripts/production-evidence-ledger-contract-tests.mjs

      - name: Core 6/6 — Release integrity chain
        run: node scripts/release-integrity-chain-contract-tests.mjs

      - name: Build Next.js runtime once
        run: npm run build

      - name: Emit exact-SHA core release manifest
        run: node scripts/core-release-gate-manifest.mjs

      - name: Truth boundary
        run: |
          echo "✓ Core Release Gate is an early, consolidated CODE + CI + build verdict for the exact candidate SHA."
          echo "✓ Existing independent Cloud, Generation, Attestation, Ledger, Release Integrity, UI, capacity and other evidence gates remain authoritative and are not removed or bypassed."
          echo "✓ This gate does not deploy Production, mutate Supabase/DNS, prove physical-device behavior, prove provider-LIVE output, claim independent third-party audit evidence, submit to Apple/Google stores, or advance Email/WhatsApp/SMS delivery."
