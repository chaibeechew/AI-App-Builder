name: LANERIQ Release Integrity Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-integrity-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run release integrity chain contracts
        run: node scripts/release-integrity-chain-contract-tests.mjs
      - name: Report
        run: echo "LANERIQ release integrity chain passed. This verifies content-addressed source resolution, release evidence binding, append-only promotion decisions and TOCTOU-resistant candidate locking. It does not deploy providers, mutate Production/DNS, add paid artifact storage or dedicated servers, claim native-store LIVE evidence, or advance Email/SMS."
