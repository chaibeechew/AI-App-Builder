name: Independent Memory Service Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify standalone memory service
        run: node services/memory/test/contract.mjs
      - name: Verify existing Project Memory contracts
        run: npm run test:memory
      - name: Build Next.js host
        run: npm run build
