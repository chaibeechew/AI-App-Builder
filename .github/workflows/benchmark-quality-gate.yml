name: LANERIQ Benchmark Factory & Quality Judge Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generation Outcome Intelligence contracts
        run: npm run test:generation-outcome
      - name: Benchmark Factory & Automatic Quality Judge contracts
        run: npm run test:benchmark-factory
      - name: Quality Autonomy 2 contracts
        run: npm run test:quality-autonomy-2
      - name: Deterministic zero-cost generation sample
        run: npm run sample:release-quality
      - name: Autonomous Self-Heal integration contracts
        run: npm run test:self-heal
      - name: Upload release quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laneriq-release-quality-${{ github.sha }}
          path: artifacts/quality/release-quality-generation-sample.json
          if-no-files-found: warn
          retention-days: 30
      - name: Evidence boundary
        run: echo "This gate is CODE/CI evidence plus deterministic zero-cost local generation sampling. It does not claim external-provider LIVE, Production browser, physical-device, store, market or legal originality success."
