name: LANERIQ Canonical Voice Gate

on:
  pull_request:
    paths:
      - 'app/api/laneriq/voice/**'
      - 'lib/laneriq/voice-compatibility-adapter.js'
      - 'app/api/soolenai/voice/**'
      - 'config/soolenai-voice.js'
      - 'scripts/laneriq-canonical-voice-contract-tests.mjs'
      - '.github/workflows/laneriq-canonical-voice-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laneriq-canonical-voice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-voice-contract:
    name: Canonical voice contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify LANERIQ canonical voice
        run: node scripts/laneriq-canonical-voice-contract-tests.mjs
