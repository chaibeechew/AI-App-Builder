name: LANERIQ Outcome Intelligence & Release Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  outcome-intelligence-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generation Outcome Intelligence baseline
        run: npm run test:generation-outcome
      - name: Benchmark Factory baseline
        run: npm run test:benchmark-factory
      - name: Outcome Intelligence and Release Quality contracts
        run: node scripts/outcome-intelligence-release-gate-tests.mjs
      - name: Build runtime integration
        run: npm run build
      - name: Evidence boundary
        run: echo "This gate proves deterministic CODE/CI quality-control behavior only; external-provider LIVE, Production runtime, browser, physical-device and store evidence remain independent."
