name: Game World Architecture V17 Gate
on:
  push:
    branches: [batch177-game-world-architecture-v17]
  pull_request:
    paths:
      - 'lib/game/game-world-architecture-v17.js'
      - 'scripts/game-world-architecture-v17-tests.mjs'
      - '.github/workflows/game-world-architecture-v17.yml'
jobs:
  architecture-v17:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/game-world-vegetation-v16-tests.mjs
      - run: node scripts/game-world-architecture-v17-tests.mjs
