name: Consolidated Preview CI

on:
  push:
    branches:
      - integration/primary-consolidation
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Release policy regression tests
        run: npm run test:release
      - name: Security and ownership contract tests
        run: npm run test:security
      - name: Runtime reliability contract tests
        run: npm run test:runtime
      - name: Non-production 100-point product tests
        run: npm run test:nonprod
      - name: AI BUILD APP & WEB customer-facing brand contract tests
        run: node scripts/product-brand-tests.mjs
      - name: AI BUILD APP & WEB SEO foundation contract tests
        run: node scripts/seo-foundation-tests.mjs
      - name: Project Readiness contract tests
        run: node scripts/project-readiness-tests.mjs
      - name: Publishing Readiness contract tests
        run: node scripts/publishing-readiness-tests.mjs
      - name: Industry capability planning contract tests
        run: node scripts/industry-capability-tests.mjs
      - name: Mobile game and AI media capability contract tests
        run: node scripts/mobile-game-capability-tests.mjs
      - name: Multidimensional game taxonomy contract tests
        run: node scripts/game-taxonomy-tests.mjs
      - name: Pro Game Runtime V1 contract tests
        run: node scripts/game-runtime-v1-tests.mjs
      - name: Genre Runtime Intelligence contract tests
        run: node scripts/genre-runtime-intelligence-tests.mjs
      - name: RPG Puzzle Action specialist contract tests
        run: node scripts/genre-specialist-tests.mjs
      - name: Advanced genre runtime contract tests
        run: node scripts/advanced-game-genres-tests.mjs
      - name: Remaining specialist genres and Live Transport contract tests
        run: node scripts/remaining-genres-and-transport-tests.mjs
      - name: Game platform systems and 3D world contract tests
        run: node scripts/game-platform-world-tests.mjs
      - name: Deep RPG open-world and Platform Lab contract tests
        run: node scripts/rpg-open-world-platform-lab-tests.mjs
      - name: Advanced 3D gameplay and workbench contract tests
        run: node scripts/advanced-3d-gameplay-tests.mjs
      - name: AAA mobile production and engine lab contract tests
        run: node scripts/aaa-mobile-production-tests.mjs
      - name: Large-game content production pipeline contract tests
        run: node scripts/content-production-pipeline-tests.mjs
      - name: Game Studio Intelligence and Autonomous QA contract tests
        run: node scripts/game-studio-intelligence-tests.mjs
      - name: Autonomous Game Director V2 contract tests
        run: node scripts/autonomous-game-director-v2-tests.mjs
      - name: Autonomous Game Development Agent V3 contract tests
        run: node scripts/autonomous-game-development-agent-v3-tests.mjs
      - name: Autonomous Game Development Agent V4 contract tests
        run: node scripts/autonomous-game-development-v4-tests.mjs
      - name: Complete Game Creation and Repository-aware V5 contract tests
        run: node scripts/complete-game-creation-tests.mjs
      - name: Real game end-to-end playtest gate
        run: node scripts/real-game-e2e-tests.mjs
      - name: MOBA Runtime V1 contract tests
        run: node scripts/moba-runtime-v1-tests.mjs
      - name: Aviation knowledge contract tests
        run: node scripts/aviation-knowledge-tests.mjs
      - name: Air Combat Runtime V1 and 3D foundation contract tests
        run: node scripts/air-combat-runtime-v1-tests.mjs
      - name: Authoritative multiplayer core contract tests
        run: node scripts/multiplayer-authority-v1-tests.mjs
      - name: MMO architecture readiness contract tests
        run: node scripts/mmo-architecture-tests.mjs
      - name: Zero-cost Vercel function budget guard
        run: node scripts/vercel-function-budget-tests.mjs
      - name: 100-point structural readiness gate
        run: npm run quality:100
      - run: npm run build

# Production deployment is intentionally not part of this workflow.
# Production promotion remains on hold until explicitly approved after Preview validation.
