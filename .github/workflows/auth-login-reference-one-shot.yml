name: Auth login reference one-shot

on:
  push:
    branches:
      - ui/18-page-reference-layout-v1
    paths:
      - '.github/workflows/auth-login-reference-one-shot.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/18-page-reference-layout-v1
          persist-credentials: true
      - name: Apply approved login and eight-digit OTP UI
        run: python scripts/apply-auth-reference-once.py
      - name: Commit real auth files and remove temporary updater
        run: |
          git rm .github/workflows/auth-login-reference-one-shot.yml scripts/apply-auth-reference-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/auth/page.js app/auth/auth.css
          git commit -m 'UI: align login and 8-digit email verification to approved reference'
          git push origin HEAD:ui/18-page-reference-layout-v1
