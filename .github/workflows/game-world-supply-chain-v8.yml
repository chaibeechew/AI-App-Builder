name: Game World Supply Chain V8 Gate
on:
  push:
    branches: [batch146-game-world-supply-chain-v8]
  pull_request:
    paths:
      - 'lib/game/game-world-supply-chain-v8.js'
      - 'scripts/game-world-supply-chain-v8-tests.mjs'
      - '.github/workflows/game-world-supply-chain-v8.yml'
jobs:
  supply-chain-v8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/game-world-supply-chain-v8-tests.mjs
