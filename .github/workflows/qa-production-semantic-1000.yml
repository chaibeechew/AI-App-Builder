name: LANERIQ AI QA Production Semantic Stability 1000

on:
  push:
    branches: [qa-production-semantic-1000-20260902]

jobs:
  production-semantic-stability-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run 1000 Production stability cycles with capability semantics
        env:
          LANERIQ_PRODUCTION_URL: https://laneriq-ai.vercel.app
          LANERIQ_STABILITY_RUNS: '1000'
          LANERIQ_STABILITY_TIMEOUT_MS: '8000'
        run: node scripts/production-stability-100.mjs
