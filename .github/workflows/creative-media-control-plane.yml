name: Creative Media Control Plane

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/ai/creative-media-control-plane.js'
      - 'lib/ai/media-capabilities.js'
      - 'lib/ai/image-generation-gateway.js'
      - 'lib/video/**'
      - 'app/api/images/**'
      - 'app/api/video/**'
      - 'scripts/creative-media-control-plane-contract-tests.mjs'
      - '.github/workflows/creative-media-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ai/creative-media-control-plane.js'
      - 'lib/ai/media-capabilities.js'
      - 'lib/ai/image-generation-gateway.js'
      - 'lib/video/**'
      - 'app/api/images/**'
      - 'app/api/video/**'
      - 'scripts/creative-media-control-plane-contract-tests.mjs'

jobs:
  creative-media-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Creative media control-plane contract
        run: node scripts/creative-media-control-plane-contract-tests.mjs
      - name: Image Studio regression
        run: npm run test:image-studio
      - name: AI Video regression
        run: npm run test:video
      - name: AI Avatar regression
        run: npm run test:avatar
      - name: Truth boundary
        run: echo 'Creative media CODE readiness does not imply provider or Production LIVE evidence.'
