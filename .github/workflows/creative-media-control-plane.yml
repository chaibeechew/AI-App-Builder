name: Creative Media Control Plane

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/ai/creative-media-control-plane.js'
      - 'lib/ai/creative-media-quality-judge.js'
      - 'lib/ai/creative-media-provider-selection.js'
      - 'lib/ai/creative-image-generation-gateway.js'
      - 'lib/ai/creative-media-continuity.js'
      - 'lib/ai/creative-media-observation-judge.js'
      - 'lib/ai/creative-media-intelligence-engine.js'
      - 'lib/ai/media-capabilities.js'
      - 'lib/ai/image-generation-gateway.js'
      - 'lib/media/reference-policy.js'
      - 'lib/media/reference-reuse.js'
      - 'lib/video/**'
      - 'app/components/ReferenceUploader.js'
      - 'app/api/reference-analyze/**'
      - 'app/api/images/**'
      - 'app/api/video/**'
      - 'scripts/upload-ref-contract-tests.mjs'
      - 'scripts/creative-media-control-plane-contract-tests.mjs'
      - 'scripts/creative-media-quality-runtime-contract-tests.mjs'
      - 'scripts/creative-media-six-layer-contract-tests.mjs'
      - '.github/workflows/creative-media-control-plane.yml'
  push:
    branches:
      - main
      - 'batch*-ai-image-video-*'
      - 'batch*-image-*'
      - 'batch*-video-*'
      - 'batch*-media-*'
    paths:
      - 'lib/ai/creative-media-control-plane.js'
      - 'lib/ai/creative-media-quality-judge.js'
      - 'lib/ai/creative-media-provider-selection.js'
      - 'lib/ai/creative-image-generation-gateway.js'
      - 'lib/ai/creative-media-continuity.js'
      - 'lib/ai/creative-media-observation-judge.js'
      - 'lib/ai/creative-media-intelligence-engine.js'
      - 'lib/ai/media-capabilities.js'
      - 'lib/ai/image-generation-gateway.js'
      - 'lib/media/reference-policy.js'
      - 'lib/media/reference-reuse.js'
      - 'lib/video/**'
      - 'app/components/ReferenceUploader.js'
      - 'app/api/reference-analyze/**'
      - 'app/api/images/**'
      - 'app/api/video/**'
      - 'scripts/upload-ref-contract-tests.mjs'
      - 'scripts/creative-media-control-plane-contract-tests.mjs'
      - 'scripts/creative-media-quality-runtime-contract-tests.mjs'
      - 'scripts/creative-media-six-layer-contract-tests.mjs'
      - '.github/workflows/creative-media-control-plane.yml'

jobs:
  creative-media-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Creative media control-plane contract
        run: node scripts/creative-media-control-plane-contract-tests.mjs
      - name: Creative media quality and provider runtime contract
        run: node scripts/creative-media-quality-runtime-contract-tests.mjs
      - name: Creative media Image 5-layer and Video 6-layer hardening contract
        run: node scripts/creative-media-six-layer-contract-tests.mjs
      - name: Media preprocessing and exact private reuse regression
        run: npm run test:upload-ref
      - name: Image Studio regression
        run: npm run test:image-studio
      - name: AI Video regression
        run: npm run test:video
      - name: AI Avatar regression
        run: npm run test:avatar
      - name: Truth boundary
        run: echo 'Creative media CODE/CI readiness does not imply provider, browser, Production or real-output quality evidence.'
