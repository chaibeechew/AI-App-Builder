name: WhatsApp Cloud Contract

on:
  pull_request:
    paths:
      - 'app/api/whatsapp/**'
      - 'lib/integrations/server.js'
      - 'proxy.js'
      - 'supabase/functions/send-whatsapp-otp/**'
      - 'supabase/config.toml'
      - 'scripts/whatsapp-cloud-webhook-contract-tests.mjs'
      - 'scripts/whatsapp-otp-hook-contract-tests.mjs'
      - '.github/workflows/whatsapp-cloud.yml'
  push:
    branches:
      - main
    paths:
      - 'app/api/whatsapp/**'
      - 'lib/integrations/server.js'
      - 'proxy.js'
      - 'supabase/functions/send-whatsapp-otp/**'
      - 'supabase/config.toml'
      - 'scripts/whatsapp-cloud-webhook-contract-tests.mjs'
      - 'scripts/whatsapp-otp-hook-contract-tests.mjs'
      - '.github/workflows/whatsapp-cloud.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify WhatsApp Cloud webhook contract
        run: node scripts/whatsapp-cloud-webhook-contract-tests.mjs
      - name: Verify WhatsApp OTP auth hook contract
        run: node scripts/whatsapp-otp-hook-contract-tests.mjs
