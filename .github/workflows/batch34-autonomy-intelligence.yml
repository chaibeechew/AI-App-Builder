name: LANERIQ Autonomy Intelligence & Observability Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  autonomy-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      SUPABASE_SECRET_KEY: placeholder-service-secret-at-least-32-characters
      LANERIQ_SESSION_SECRET: placeholder-session-secret-at-least-32-characters
      LANERIQ_VERIFICATION_SECRET: placeholder-verification-secret-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Batch 34 contracts
        run: node scripts/batch34-autonomy-intelligence-contract-tests.mjs
      - name: Industry Intelligence regression
        run: npm run test:industry-intelligence
      - name: Benchmark Factory regression
        run: npm run test:benchmark-factory
      - name: Sovereign Service Fabric regression
        run: node services/fabric/test/registry.mjs
      - name: Communications zero-cost regression
        run: npm run test:zero-cost-communications
      - name: Production build
        run: npm run build
      - name: Evidence boundary
        run: echo "Batch 34 is CODE/CI evidence only for autonomy, template fusion, observability and cutover gates. It does not claim standalone provider LIVE, physical device, store or Production canary success."
