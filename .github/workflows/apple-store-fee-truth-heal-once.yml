name: Apple Store Fee Truth Heal Once

on:
  push:
    branches:
      - ui/18-page-reference-layout-v1
    paths:
      - .github/workflows/apple-store-fee-truth-heal-once.yml

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/18-page-reference-layout-v1
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Restore developer-account fee truth boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/publish/[id]/page.js')
          text = path.read_text()
          old = '<p>◉ Apple/Google fees are paid directly to the platforms.</p><p>◉ Store review and approval cannot be guaranteed by LANERIQ.</p>'
          new = '<p>◉ Apple/Google fees are paid directly to the platforms.</p><p>◉ LANERIQ AI does not collect, mark up or keep developer-account fees.</p><p>◉ Store review and approval cannot be guaranteed by LANERIQ.</p>'
          if old not in text:
              raise SystemExit('Expected Publishing Tips fee boundary was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify Apple and Google store contracts
        run: |
          npm run test:apple-store
          npm run test:google-play
      - name: Production build
        run: npm run build
      - name: Commit verified source repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/publish/[id]/page.js'
          git rm .github/workflows/apple-store-fee-truth-heal-once.yml
          git commit -m "Publish: restore store developer-fee truth boundary"
          git push origin HEAD:ui/18-page-reference-layout-v1
