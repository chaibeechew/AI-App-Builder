name: Auth Mobile Entry Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  auth-mobile-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:auth-mobile-entry
