name: Game World Simulation Intelligence Gate

on:
  push:
    branches:
      - batch131-game-world-simulation-intelligence-100
  pull_request:
    paths:
      - "app/game-world-simulation/**"
      - "app/game-builder/layout.js"
      - "lib/game/game-world-simulation-intelligence-v1.js"
      - "lib/game/game-world-reasoning-orchestrator-v1.js"
      - "lib/game/game-world-readiness-v1.js"
      - "scripts/game-world-simulation-intelligence-tests.mjs"
      - "scripts/game-world-reasoning-orchestrator-tests.mjs"
      - "scripts/game-world-readiness-tests.mjs"
      - ".github/workflows/game-world-simulation-intelligence.yml"

permissions:
  contents: read

concurrency:
  group: game-world-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Game World foundation regression
        run: node scripts/game-world-generator-tests.mjs
      - name: Simulation Intelligence 100 contracts
        run: node scripts/game-world-simulation-intelligence-tests.mjs
      - name: Multi-hypothesis Reasoning Orchestrator contracts
        run: node scripts/game-world-reasoning-orchestrator-tests.mjs
      - name: Unified Game World internal 100 readiness
        run: node scripts/game-world-readiness-tests.mjs
      - name: Existing Game Runtime regression
        run: node scripts/game-runtime-v1-tests.mjs
      - name: Advanced 3D regression
        run: node scripts/advanced-3d-gameplay-tests.mjs
      - name: Content Pipeline regression
        run: node scripts/content-production-pipeline-tests.mjs
      - name: Next.js production build
        run: npm run build
