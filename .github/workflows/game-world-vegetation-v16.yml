name: Game World Vegetation V16 Gate
on:
  push:
    branches: [batch176-game-world-vegetation-v16]
  pull_request:
    paths:
      - 'lib/game/game-world-vegetation-v16.js'
      - 'scripts/game-world-vegetation-v16-tests.mjs'
      - '.github/workflows/game-world-vegetation-v16.yml'
jobs:
  vegetation-v16:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/game-world-hydrology-ecology-v15-tests.mjs
      - run: node scripts/game-world-vegetation-v16-tests.mjs
