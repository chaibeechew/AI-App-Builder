name: Provider Router Production Truth Gate

on:
  pull_request:
    paths:
      - "engine/ai-provider.js"
      - "lib/ai/provider-router.js"
      - "lib/ai/provider-router-truth.js"
      - "lib/soolen/cost-policy.js"
      - "app/api/ai/provider-router/**"
      - "scripts/provider-router-production-truth-tests.mjs"
      - ".github/workflows/provider-router-production-gate.yml"
  push:
    branches: [main]
    paths:
      - "engine/ai-provider.js"
      - "lib/ai/provider-router.js"
      - "lib/ai/provider-router-truth.js"
      - "lib/soolen/cost-policy.js"
      - "app/api/ai/provider-router/**"
      - "scripts/provider-router-production-truth-tests.mjs"
      - ".github/workflows/provider-router-production-gate.yml"

permissions:
  contents: read

jobs:
  provider-router-production-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify Provider Router failover, quota guard and Truth Gate
        run: node scripts/provider-router-production-truth-tests.mjs
