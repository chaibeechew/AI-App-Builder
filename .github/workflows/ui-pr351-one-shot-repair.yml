name: UI PR351 one-shot repair

on:
  push:
    branches:
      - ui/18-page-reference-layout-v1
    paths:
      - '.github/workflows/ui-pr351-one-shot-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/18-page-reference-layout-v1
          persist-credentials: true
      - name: Repair Analytics parser typo and remove this one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/analytics/[id]/page.js')
          s=p.read_text()
          old='channels.filter(([name])=>![/app|web/i.test(name))'
          new='channels.filter(([name])=>!(/app|web/i).test(name))'
          if old not in s:
              raise SystemExit('expected Analytics typo not found')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/ui-pr351-one-shot-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/analytics/'[id]'/page.js
          git commit -m 'Fix Analytics channel filter parser typo'
          git push origin HEAD:ui/18-page-reference-layout-v1
