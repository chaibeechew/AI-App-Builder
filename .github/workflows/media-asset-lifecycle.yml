name: Media Asset Lifecycle Integration

on:
  push:
    branches:
      - 'batch97-*'
    paths:
      - 'lib/ai/creative-media-lifecycle.js'
      - 'lib/ai/creative-media-lifecycle-adapter.js'
      - 'lib/ai/image-output-persistence.js'
      - 'lib/video/output-persistence.js'
      - 'app/api/media/**'
      - 'scripts/creative-media-lifecycle-contract-tests.mjs'
      - '.github/workflows/media-asset-lifecycle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/ai/creative-media-lifecycle.js'
      - 'lib/ai/creative-media-lifecycle-adapter.js'
      - 'lib/ai/image-output-persistence.js'
      - 'lib/video/output-persistence.js'
      - 'app/api/media/**'
      - 'scripts/creative-media-lifecycle-contract-tests.mjs'
      - '.github/workflows/media-asset-lifecycle.yml'

jobs:
  media-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Media lifecycle contract
        run: node scripts/creative-media-lifecycle-contract-tests.mjs
      - name: Upload ownership regression
        run: npm run test:upload-ref
      - name: Image Studio regression
        run: npm run test:image-studio
      - name: AI Video regression
        run: npm run test:video
      - name: App and Website combined E2E regression
        run: npm run test:combined-e2e-code
      - name: Truth boundary
        run: echo 'Lifecycle CODE/CI readiness does not imply LIVE provider, Production, browser, device or real-output quality evidence.'
