name: Game World Production World V20 Gate
on:
  push:
    branches: [batch180-game-world-production-world-v20]
  pull_request:
    paths:
      - 'lib/game/game-world-terrain-v14.js'
      - 'lib/game/game-world-hydrology-ecology-v15.js'
      - 'lib/game/game-world-vegetation-v16.js'
      - 'lib/game/game-world-architecture-v17.js'
      - 'lib/game/game-world-interior-v18.js'
      - 'lib/game/game-world-city-v19.js'
      - 'lib/game/game-world-production-world-v20.js'
      - 'scripts/game-world-*-v1[4-9]-tests.mjs'
      - 'scripts/game-world-production-world-v20-tests.mjs'
      - 'app/game-world-v20/**'
      - 'app/game-builder/layout.js'
      - '.github/workflows/game-world-production-world-v20.yml'
jobs:
  production-world-v20:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - name: V13 production/export regression
        run: node scripts/game-world-production-export-v13-tests.mjs
      - name: V14 terrain
        run: node scripts/game-world-terrain-v14-tests.mjs
      - name: V15 hydrology ecology
        run: node scripts/game-world-hydrology-ecology-v15-tests.mjs
      - name: V16 vegetation
        run: node scripts/game-world-vegetation-v16-tests.mjs
      - name: V17 architecture
        run: node scripts/game-world-architecture-v17-tests.mjs
      - name: V18 interior
        run: node scripts/game-world-interior-v18-tests.mjs
      - name: V19 city
        run: node scripts/game-world-city-v19-tests.mjs
      - name: V20 production world
        run: node scripts/game-world-production-world-v20-tests.mjs
      - name: Advanced 3D regression
        run: node scripts/advanced-3d-gameplay-systems-tests.mjs
      - name: Content production regression
        run: node scripts/content-production-pipeline-tests.mjs
      - name: Next production build
        run: npm run build
