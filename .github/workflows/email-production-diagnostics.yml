name: LANERIQ Email Production Diagnostics

on:
  push:
    branches: [fix-email-smtp-starttls-20260902]
    paths:
      - '.github/workflows/email-production-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-email-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secret presence
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN RESEND_API_KEY EMAIL_FROM; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_${name}=true"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 2; fi
          echo "Required deployment secrets are present."

      - name: Verify Resend API credentials without sending email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/resend-domains.json --write-out '%{http_code}' \
            --request GET \
            --url 'https://api.resend.com/domains' \
            --header "Authorization: Bearer ${RESEND_API_KEY}")"
          if [ "$code" != "200" ]; then
            echo "Resend credential probe failed with HTTP ${code}."
            exit 3
          fi
          echo "Resend API authentication is healthy."

      - name: Inspect Vercel Production transport bindings without decrypting values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request GET \
            --url 'https://api.vercel.com/v10/projects/prj_Q6mR7lmYGGKCW0ARu2Fgm9Pyzfcl/env?teamId=team_r2xREQWKQzVw1bdswbpW5j8Y' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --output /tmp/vercel-env.json

          production_has_key() {
            jq -e --arg key "$1" '.envs[]? | select(.key == $key and ((.target // []) | index("production")))' /tmp/vercel-env.json >/dev/null
          }

          production_has_key RESEND_API_KEY || { echo 'Production RESEND_API_KEY binding is missing.'; exit 4; }
          production_has_key EMAIL_FROM || { echo 'Production EMAIL_FROM binding is missing.'; exit 5; }

          legacy_count="$(jq '[.envs[]? | select((.key == "SMTP_HOST" or .key == "SMTP_USER" or .key == "SMTP_PASS" or .key == "SMTP_PORT") and ((.target // []) | index("production")))] | length' /tmp/vercel-env.json)"
          echo "Production managed Resend bindings are present."
          echo "LEGACY_SMTP_PRODUCTION_BINDINGS=${legacy_count}"

      - name: Confirm sender configuration is non-empty without exposing it
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          test -n "$EMAIL_FROM"
          case "$EMAIL_FROM" in
            *@*) echo 'EMAIL_FROM format contains a mailbox domain.' ;;
            *) echo 'EMAIL_FROM format is invalid.'; exit 6 ;;
          esac
