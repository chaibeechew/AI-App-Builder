name: Creative Media Delivery Mastering 100

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/ai/creative-media-mastering-engine.js'
      - 'lib/ai/creative-media-delivery-presets.js'
      - 'lib/ai/creative-caption-accessibility.js'
      - 'lib/ai/creative-media-delivery-qc.js'
      - 'scripts/creative-media-mastering-contract-tests.mjs'
      - '.github/workflows/creative-media-mastering.yml'
  push:
    branches:
      - main
      - 'batch*-creative-media-*'
    paths:
      - 'lib/ai/creative-media-mastering-engine.js'
      - 'lib/ai/creative-media-delivery-presets.js'
      - 'lib/ai/creative-caption-accessibility.js'
      - 'lib/ai/creative-media-delivery-qc.js'
      - 'scripts/creative-media-mastering-contract-tests.mjs'
      - '.github/workflows/creative-media-mastering.yml'

jobs:
  mastering-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Creative Media delivery mastering contract
        run: node scripts/creative-media-mastering-contract-tests.mjs
      - name: Creative Media control-plane regression
        run: node scripts/creative-media-control-plane-contract-tests.mjs
      - name: Creative Media quality regression
        run: node scripts/creative-media-quality-runtime-contract-tests.mjs
      - name: Image Studio regression
        run: npm run test:image-studio
      - name: AI Video regression
        run: npm run test:video
      - name: AI Avatar regression
        run: npm run test:avatar
      - name: Truth boundary
        run: echo 'Mastering presets are internal CODE/CI baselines; no platform certification, store acceptance, Production or real-device playback claim is implied.'
