name: LANERIQ AI Production Stability 1000

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-stability-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANERIQ_PRODUCTION_URL: https://laneriq-ai.vercel.app
      LANERIQ_STABILITY_RUNS: '1000'
      LANERIQ_STABILITY_TIMEOUT_MS: '8000'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run final 1000 production stability cycles
        run: node scripts/production-stability-100.mjs
