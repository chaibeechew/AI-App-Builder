name: LANERIQ AI QA Production Mobile Browser

on:
  push:
    branches: [qa-mobile-browser-production-20260902]

jobs:
  production-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LANERIQ_PRODUCTION_URL: https://laneriq-ai.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install browser QA dependency
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.57.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Production mobile browser QA
        run: timeout --signal=TERM --kill-after=10s 90s node scripts/qa-production-mobile-browser.mjs
