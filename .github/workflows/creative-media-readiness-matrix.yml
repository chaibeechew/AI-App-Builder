name: Creative Media Readiness Matrix

on:
  push:
    branches:
      - 'batch102-ai-media-*'
    paths:
      - 'lib/ai/creative-media-readiness-matrix.js'
      - 'app/api/media/readiness-matrix/**'
      - 'app/api/images/capabilities/**'
      - 'app/api/video/capabilities/**'
      - 'scripts/creative-media-readiness-matrix-tests.mjs'
      - '.github/workflows/creative-media-readiness-matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/ai/creative-media-readiness-matrix.js'
      - 'app/api/media/readiness-matrix/**'
      - 'app/api/images/capabilities/**'
      - 'app/api/video/capabilities/**'
      - 'scripts/creative-media-readiness-matrix-tests.mjs'
      - '.github/workflows/creative-media-readiness-matrix.yml'

jobs:
  readiness-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Creative Media readiness matrix contract
        run: node scripts/creative-media-readiness-matrix-tests.mjs
      - name: Creative Media control plane regression
        run: node scripts/creative-media-control-plane-tests.mjs
      - name: Image Studio regression
        run: npm run test:image-studio
      - name: AI Video regression
        run: npm run test:video
      - name: AI Avatar regression
        run: npm run test:avatar
      - name: Truth boundary
        run: echo 'Readiness matrix CODE/CI does not imply provider connection, Production LIVE, browser, device or real-output quality evidence.'
