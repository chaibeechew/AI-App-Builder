name: Runtime OIDC Broker Fix Bootstrap

on:
  push:
    branches:
      - fix/malware-runtime-oidc-broker-20260904
    paths:
      - '.github/workflows/runtime-oidc-broker-fix-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch request-scoped Vercel OIDC broker resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          store = Path('services/malware-defense/lib/adaptive-knowledge-store.js')
          text = store.read_text()

          marker = 'const REQUEST_TIMEOUT_MS = 5000;\n'
          insert = '''const REQUEST_TIMEOUT_MS = 5000;\nconst VERCEL_REQUEST_CONTEXT = Symbol.for("@vercel/request-context");\n'''
          if marker not in text:
              raise SystemExit('adaptive store timeout marker not found')
          text = text.replace(marker, insert, 1)

          marker = '''function safeBrokerUrl(value) {\n  try {\n    const url = new URL(text(value || DEFAULT_BROKER_URL));\n    if (url.protocol !== "https:" || url.username || url.password || url.hostname !== BROKER_HOST || url.pathname !== BROKER_PATH) return null;\n    url.search = "";\n    url.hash = "";\n    return url.toString();\n  } catch {\n    return null;\n  }\n}\n\nfunction config(env = process.env) {\n'''
          replacement = '''function safeBrokerUrl(value) {\n  try {\n    const url = new URL(text(value || DEFAULT_BROKER_URL));\n    if (url.protocol !== "https:" || url.username || url.password || url.hostname !== BROKER_HOST || url.pathname !== BROKER_PATH) return null;\n    url.search = "";\n    url.hash = "";\n    return url.toString();\n  } catch {\n    return null;\n  }\n}\n\nfunction runtimeOidcIdentity(env = process.env) {\n  // Vercel's production OIDC helper resolves the current request-scoped token\n  // before falling back to the deployment environment. Never cache this value.\n  const context = globalThis[VERCEL_REQUEST_CONTEXT]?.get?.() || {};\n  const contextToken = text(context?.headers?.["x-vercel-oidc-token"]);\n  if (contextToken.length >= 100 && contextToken.length <= 16_384) {\n    return Object.freeze({ token: contextToken, source: "REQUEST_CONTEXT" });\n  }\n  const environmentToken = text(env.VERCEL_OIDC_TOKEN);\n  if (environmentToken.length >= 100 && environmentToken.length <= 16_384) {\n    return Object.freeze({ token: environmentToken, source: "ENVIRONMENT_FALLBACK" });\n  }\n  return Object.freeze({ token: "", source: "NOT_AVAILABLE" });\n}\n\nfunction config(env = process.env) {\n'''
          if marker not in text:
              raise SystemExit('adaptive store safeBrokerUrl/config marker not found')
          text = text.replace(marker, replacement, 1)

          marker = '''  const brokerUrl = safeBrokerUrl(env.LANERIQ_ADAPTIVE_KNOWLEDGE_BROKER_URL || DEFAULT_BROKER_URL);\n  const oidcToken = text(env.VERCEL_OIDC_TOKEN);\n  const oidcBrokerConfigured = Boolean(brokerUrl && oidcToken.length >= 100 && oidcToken.length <= 16_384);\n  return Object.freeze({\n    url,\n    key,\n    brokerUrl,\n    oidcToken,\n    directDatabaseConfigured,\n    oidcBrokerConfigured,\n    configured: directDatabaseConfigured || oidcBrokerConfigured,\n    mode: directDatabaseConfigured ? "DIRECT_DATABASE" : oidcBrokerConfigured ? "VERCEL_OIDC_BROKER" : "NOT_CONFIGURED",\n  });\n}\n'''
          replacement = '''  const brokerUrl = safeBrokerUrl(env.LANERIQ_ADAPTIVE_KNOWLEDGE_BROKER_URL || DEFAULT_BROKER_URL);\n  const oidc = runtimeOidcIdentity(env);\n  const oidcToken = oidc.token;\n  const oidcBrokerConfigured = Boolean(brokerUrl && oidcToken.length >= 100 && oidcToken.length <= 16_384);\n  return Object.freeze({\n    url,\n    key,\n    brokerUrl,\n    oidcToken,\n    oidcTokenSource: oidc.source,\n    directDatabaseConfigured,\n    oidcBrokerConfigured,\n    configured: directDatabaseConfigured || oidcBrokerConfigured,\n    mode: directDatabaseConfigured ? "DIRECT_DATABASE" : oidcBrokerConfigured ? "VERCEL_OIDC_BROKER" : "NOT_CONFIGURED",\n  });\n}\n'''
          if marker not in text:
              raise SystemExit('adaptive store config token marker not found')
          text = text.replace(marker, replacement, 1)

          marker = '''    oidcBrokerReady: cfg.oidcBrokerConfigured,\n    secretlessBrokerPreferredWhenDirectDatabaseUnavailable: true,\n'''
          replacement = '''    oidcBrokerReady: cfg.oidcBrokerConfigured,\n    oidcTokenSource: cfg.oidcTokenSource,\n    requestScopedOidcPreferred: true,\n    secretlessBrokerPreferredWhenDirectDatabaseUnavailable: true,\n'''
          if marker not in text:
              raise SystemExit('adaptive store configuration output marker not found')
          text = text.replace(marker, replacement, 1)
          store.write_text(text)

          test = Path('services/malware-defense/test/adaptive-knowledge-store.mjs')
          text = test.read_text()
          marker = 'const profile = {\n'
          replacement = '''const REQUEST_CONTEXT_SYMBOL = Symbol.for("@vercel/request-context");\nconst profile = {\n'''
          if marker not in text:
              raise SystemExit('test profile marker not found')
          text = text.replace(marker, replacement, 1)

          marker = 'const originalFetch = globalThis.fetch;\ntry {\n'
          replacement = '''const originalFetch = globalThis.fetch;\nconst originalRequestContext = globalThis[REQUEST_CONTEXT_SYMBOL];\ntry {\n'''
          if marker not in text:
              raise SystemExit('test original fetch marker not found')
          text = text.replace(marker, replacement, 1)

          marker = '''  const brokerHealth = await adaptiveKnowledgeStoreHealth({ env: brokerEnv });\n  assert.equal(brokerHealth.connectionMode, "VERCEL_OIDC_BROKER");\n  assert.equal(brokerHealth.reachable, true);\n  assert.equal(brokerHealth.auditReadable, true);\n  assert.equal(brokerHealth.durableKnowledgeStoreReady, true);\n  assert.equal(brokerHealth.historicalKnowledgeReadReady, true);\n  assert.equal(brokerHealth.evidenceLevel, "LIVE_SECRETLESS_OIDC_DURABLE_STORE_VERIFIED");\n  assert.equal(calls.length, 1);\n} finally {\n  globalThis.fetch = originalFetch;\n}\n'''
          replacement = '''  const brokerHealth = await adaptiveKnowledgeStoreHealth({ env: brokerEnv });\n  assert.equal(brokerHealth.connectionMode, "VERCEL_OIDC_BROKER");\n  assert.equal(brokerHealth.reachable, true);\n  assert.equal(brokerHealth.auditReadable, true);\n  assert.equal(brokerHealth.durableKnowledgeStoreReady, true);\n  assert.equal(brokerHealth.historicalKnowledgeReadReady, true);\n  assert.equal(brokerHealth.evidenceLevel, "LIVE_SECRETLESS_OIDC_DURABLE_STORE_VERIFIED");\n  assert.equal(calls.length, 1);\n\n  calls.length = 0;\n  const requestScopedToken = "r".repeat(220);\n  globalThis[REQUEST_CONTEXT_SYMBOL] = {\n    get: () => ({ headers: { "x-vercel-oidc-token": requestScopedToken } }),\n  };\n  const requestScopedConfiguration = adaptiveKnowledgeStoreConfiguration({});\n  assert.equal(requestScopedConfiguration.configured, true);\n  assert.equal(requestScopedConfiguration.connectionMode, "VERCEL_OIDC_BROKER");\n  assert.equal(requestScopedConfiguration.oidcBrokerReady, true);\n  assert.equal(requestScopedConfiguration.oidcTokenSource, "REQUEST_CONTEXT");\n  assert.equal(requestScopedConfiguration.requestScopedOidcPreferred, true);\n\n  const requestScopedHealth = await adaptiveKnowledgeStoreHealth({ env: {} });\n  assert.equal(requestScopedHealth.connectionMode, "VERCEL_OIDC_BROKER");\n  assert.equal(requestScopedHealth.oidcTokenSource, "REQUEST_CONTEXT");\n  assert.equal(requestScopedHealth.durableKnowledgeStoreReady, true);\n  assert.equal(calls.length, 1);\n  assert.equal(calls[0].options.headers.authorization, `Bearer ${requestScopedToken}`);\n} finally {\n  globalThis.fetch = originalFetch;\n  if (originalRequestContext === undefined) delete globalThis[REQUEST_CONTEXT_SYMBOL];\n  else globalThis[REQUEST_CONTEXT_SYMBOL] = originalRequestContext;\n}\n'''
          if marker not in text:
              raise SystemExit('test broker health marker not found')
          text = text.replace(marker, replacement, 1)

          text = text.replace(
            'console.log("✓ Secretless Vercel OIDC broker supports read + write without copying Supabase credentials into Malware Defense");',
            'console.log("✓ Secretless Vercel OIDC broker resolves request-scoped Production identity before environment fallback");'
          )
          test.write_text(text)
          PY

          rm -f .github/workflows/runtime-oidc-broker-fix-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Fix Malware runtime OIDC broker identity resolution'
          git push origin HEAD:fix/malware-runtime-oidc-broker-20260904
