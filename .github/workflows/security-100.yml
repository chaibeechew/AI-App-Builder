name: Security 100 Preview Readiness

on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: 'Branch to test (no Production deployment)'
        required: true
        default: 'integration/primary-consolidation'
        type: string

jobs:
  security-100:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      GEMINI_API_KEY: test
    steps:
      - name: Checkout requested Preview branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_ref }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Release policy regression tests
        run: npm run test:release
      - name: Security and ownership contract tests
        run: npm run test:security
      - name: Runtime reliability contract tests
        run: npm run test:runtime
      - name: Non-production product contract tests
        run: npm run test:nonprod
      - name: 100-point structural readiness gate
        run: npm run quality:100
      - name: Build application
        run: npm run build
      # Production promotion is intentionally excluded. It requires separate explicit approval.
