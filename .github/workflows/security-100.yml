name: Security 100 Production Readiness

on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: 'Branch to test'
        required: true
        default: 'main'
        type: string

jobs:
  security-100:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run 100 production-readiness regression cases
        run: node tests/security/production-readiness-100.mjs
      - name: Build application
        run: npm run build
