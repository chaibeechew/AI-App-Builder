name: Game World Hydrology Ecology V15 Gate
on:
  push:
    branches: [batch175-game-world-hydrology-ecology-v15]
  pull_request:
    paths:
      - 'lib/game/game-world-hydrology-ecology-v15.js'
      - 'scripts/game-world-hydrology-ecology-v15-tests.mjs'
      - '.github/workflows/game-world-hydrology-ecology-v15.yml'
jobs:
  hydrology-ecology-v15:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/game-world-terrain-v14-tests.mjs
      - run: node scripts/game-world-hydrology-ecology-v15-tests.mjs
