name: Game World Multiplayer V12 Gate
on:
  push:
    branches: [batch150-game-world-multiplayer-v12]
  pull_request:
    paths:
      - 'lib/game/game-world-multiplayer-v12.js'
      - 'scripts/game-world-multiplayer-v12-tests.mjs'
      - '.github/workflows/game-world-multiplayer-v12.yml'
jobs:
  multiplayer-v12:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/game-world-large-world-v11-tests.mjs
      - run: node scripts/game-world-multiplayer-v12-tests.mjs
