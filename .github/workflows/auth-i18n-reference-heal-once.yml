name: Auth reference i18n heal once

on:
  push:
    branches:
      - ui/18-page-reference-layout-v1
    paths:
      - 'scripts/auth-i18n-reference-heal-once.py'

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/18-page-reference-layout-v1
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Apply approved auth i18n source updates
        run: python scripts/auth-i18n-reference-heal-once.py
      - name: Verify multilingual contract
        run: npm run test:i18n
      - name: Verify AI100 sequence
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          GEMINI_API_KEY: ci-placeholder
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SOOLEN_COST_MODE: zero
          GEMINI_API_KEY: ci-placeholder
        run: npm run build
      - name: Commit verified i18n update and remove one-shot files
        run: |
          rm -f scripts/auth-i18n-reference-heal-once.py .github/workflows/auth-i18n-reference-heal-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/i18n/catalog.js scripts/multilingual-contract-tests.mjs scripts/auth-i18n-reference-heal-once.py .github/workflows/auth-i18n-reference-heal-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "UI: align multilingual auth contract to approved verification reference"
          git push origin HEAD:ui/18-page-reference-layout-v1
