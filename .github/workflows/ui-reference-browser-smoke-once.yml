name: UI reference browser smoke once

on:
  push:
    branches:
      - ui/18-page-reference-layout-v1
    paths:
      - 'scripts/ui-reference-browser-smoke-once.mjs'

permissions:
  contents: write

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SOOLEN_COST_MODE: zero
      GEMINI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/18-page-reference-layout-v1
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start exact-head Production runtime
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/laneriq-next.log 2>&1 &
          echo $! > /tmp/laneriq-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/auth >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laneriq-next.log
          exit 1
      - name: Run browser and signed-out boundary smoke
        run: node scripts/ui-reference-browser-smoke-once.mjs
      - name: Stop runtime
        if: always()
        run: kill $(cat /tmp/laneriq-next.pid) 2>/dev/null || true
      - name: Remove temporary browser QA files
        if: success()
        run: |
          rm -f scripts/ui-reference-browser-smoke-once.mjs .github/workflows/ui-reference-browser-smoke-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ui-reference-browser-smoke-once.mjs .github/workflows/ui-reference-browser-smoke-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "QA: complete exact-head browser smoke"
          git push origin HEAD:ui/18-page-reference-layout-v1
