name: LANERIQ LIUI Product Surface Compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify LIUI homepage authority contract
        run: node scripts/big-moon-valley-home-contract-tests.mjs
      - name: Verify release shell compatibility contract
        run: node scripts/big-moon-valley-release-contract-tests.mjs
      - name: Verify Editor and Dashboard compatibility contract
        run: node scripts/big-moon-valley-workspace-contract-tests.mjs
      - name: Verify Auth and My Projects compatibility contract
        run: node scripts/big-moon-valley-account-contract-tests.mjs
      - name: Verify creator services compatibility contract
        run: node scripts/big-moon-valley-creator-services-contract-tests.mjs
      - name: Verify project intelligence compatibility contract
        run: node scripts/big-moon-valley-project-intelligence-contract-tests.mjs
      - name: Verify creative assets compatibility contract
        run: node scripts/big-moon-valley-creative-assets-contract-tests.mjs
      - name: Verify data and automation compatibility contract
        run: node scripts/big-moon-valley-data-automation-contract-tests.mjs
      - name: Verify Game and Pro commerce compatibility contract
        run: node scripts/big-moon-valley-game-pro-commerce-contract-tests.mjs
      - name: Verify discovery and community compatibility contract
        run: node scripts/big-moon-valley-discovery-community-contract-tests.mjs
