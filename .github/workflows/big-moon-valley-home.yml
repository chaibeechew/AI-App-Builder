name: Big Moon Valley Home Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Big Moon Valley homepage contract
        run: node scripts/big-moon-valley-home-contract-tests.mjs
      - name: Verify Big Moon Valley release shell contract
        run: node scripts/big-moon-valley-release-contract-tests.mjs
      - name: Verify Big Moon Valley Editor and Dashboard contract
        run: node scripts/big-moon-valley-workspace-contract-tests.mjs
      - name: Verify Big Moon Valley Auth and My Projects contract
        run: node scripts/big-moon-valley-account-contract-tests.mjs
      - name: Verify Big Moon Valley creator services contract
        run: node scripts/big-moon-valley-creator-services-contract-tests.mjs
      - name: Verify Big Moon Valley project intelligence contract
        run: node scripts/big-moon-valley-project-intelligence-contract-tests.mjs
      - name: Verify Big Moon Valley creative assets contract
        run: node scripts/big-moon-valley-creative-assets-contract-tests.mjs
      - name: Verify Big Moon Valley data and automation contract
        run: node scripts/big-moon-valley-data-automation-contract-tests.mjs
