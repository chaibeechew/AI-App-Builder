name: Security 50 Regression

on:
  push:
    branches:
      - feature/soolen-staging-2
  workflow_dispatch:

jobs:
  security-50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/soolen-staging-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node tests/security/provider-routing-50.js
      - run: npm run build
