name: Security 50 Regression

on:
  push:
    branches:
      - feature/final-pre-production-20260829
  workflow_dispatch:

jobs:
  security-50:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout final pre-production branch
        uses: actions/checkout@v4
        with:
          ref: feature/final-pre-production-20260829
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run 50 final policy regression cases
        run: node tests/security/final-policy-50.js
      - name: Build application
        run: npm run build
