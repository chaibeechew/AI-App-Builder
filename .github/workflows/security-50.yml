name: Security 50 Regression

on:
  push:
    branches:
      - feature/soolen-staging-2
  workflow_dispatch:

jobs:
  security-50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tests/security/provider-routing-50.js
      - run: npm run build
