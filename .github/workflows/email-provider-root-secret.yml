name: Email Provider Root Secret Contract
on:
  pull_request:
    paths:
      - 'lib/email-provider/server.js'
      - 'scripts/laneriq-email-provider-contract-tests.mjs'
      - '.github/workflows/email-provider-root-secret.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:email-provider
