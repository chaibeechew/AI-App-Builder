name: LANERIQ LIUI Runtime Capabilities Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  liui-runtime-capabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate context, memory, accessibility and truth-state runtime
        run: node scripts/batch95-liui-runtime-capabilities-tests.mjs
      - name: Evidence boundary
        run: echo "CODE/CI validates LIUI runtime capability contracts only. Production exact-SHA and browser/runtime evidence remain separate."
