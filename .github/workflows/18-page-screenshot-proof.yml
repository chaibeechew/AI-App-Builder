name: LANERIQ 18 Page Screenshot Proof

on:
  pull_request:
    paths:
      - '.github/workflows/18-page-screenshot-proof.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium capture runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare local-only fixture session
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const proxyPath='lib/supabase/proxy.js';
          let proxy=fs.readFileSync(proxyPath,'utf8');
          proxy=proxy.replace('export async function updateSession(request) {','export async function updateSession(request) {\n  if(process.env.LANERIQ_SCREENSHOT_FIXTURE==="1") return NextResponse.next({ request });');
          fs.writeFileSync(proxyPath,proxy);
          fs.writeFileSync('lib/supabase/screenshot-fixture.js', String.raw`
          const USER_ID='00000000-0000-4000-8000-000000000001';
          const APP_ID='11111111-1111-4111-8111-111111111111';
          const VERSION_ID='22222222-2222-4222-8222-222222222222';
          const NOW='2026-09-05T09:40:00.000Z';
          export const fixtureUser={id:USER_ID,email:'owner@laneriq.local',email_confirmed_at:NOW,confirmed_at:NOW,user_metadata:{full_name:'LANERIQ Owner'}};
          export const fixtureSpec={
            name:'Skyline Realty AI',appName:'Skyline Realty AI',description:'Premium AI real-estate operating system for listings, clients, appointments and follow-up.',industry:'real-estate',language:'English',
            pages:[{id:'home',name:'Home'},{id:'listings',name:'Listings'},{id:'property',name:'Property Detail'},{id:'clients',name:'Clients'},{id:'appointments',name:'Appointments'}],
            features:['AI property matching','Smart follow-up','Appointment booking','Listing intelligence','Customer enquiries'],
            workflows:[{name:'New enquiry follow-up'},{name:'Viewing reminder'}],
            theme:{primary:'#e5c66c',background:'#061713',style:'Premium cinematic'},
            brandKit:{name:'Skyline Realty',tone:'Premium, trusted, modern'}
          };
          export const fixtureApp={id:APP_ID,owner_id:USER_ID,name:'Skyline Realty AI',description:fixtureSpec.description,current_version_id:VERSION_ID,published_version_id:VERSION_ID,visibility:'private',publish_status:'draft',status:'ready',created_at:NOW,updated_at:NOW,specification:fixtureSpec};
          export const fixtureVersion={id:VERSION_ID,app_id:APP_ID,version_no:12,specification:fixtureSpec,created_at:NOW};
          const workflow={id:'33333333-3333-4333-8333-333333333333',app_id:APP_ID,owner_id:USER_ID,name:'New enquiry follow-up',description:'Qualify a new property enquiry and prepare the next best action.',trigger_type:'new_enquiry',trigger_config:{event:'new_enquiry'},conditions:[{field:'email',operator:'exists'}],actions:[{type:'ai_prepare_follow_up'},{type:'notify_owner'}],enabled:true,is_active:true,status:'active',created_at:NOW,updated_at:NOW};
          const run={id:'44444444-4444-4444-8444-444444444444',workflow_id:workflow.id,app_id:APP_ID,status:'success',started_at:NOW,completed_at:NOW,created_at:NOW};
          const models=[{id:'properties',app_id:APP_ID,name:'Properties',table_name:'properties',fields:[{name:'title',type:'text'},{name:'price',type:'number'},{name:'status',type:'text'}]},{id:'clients',app_id:APP_ID,name:'Clients',table_name:'clients',fields:[{name:'name',type:'text'},{name:'email',type:'text'}]}];
          const analytics=[{id:'evt-1',app_id:APP_ID,event_name:'page_view',created_at:NOW,metadata:{surface:'website'}},{id:'evt-2',app_id:APP_ID,event_name:'lead_created',created_at:NOW,metadata:{source:'listing'}}];
          function rows(table){switch(table){case'apps':return[fixtureApp];case'app_versions':return[fixtureVersion];case'app_workflows':return[workflow];case'workflow_runs':return[run];case'app_backend_models':return models;case'analytics_events':return analytics;case'project_memory':return[{id:'mem-1',app_id:APP_ID,summary:'Premium real-estate product with strong mobile-first enquiry flow.'}];case'publish_requests':return[];case'store_listings':return[];case'project_assets':return[];case'asset_library':return[];default:return[];}}
          class Query{
            constructor(table){this.table=table;this._rows=rows(table);this._write=null;}
            select(){return this} eq(){return this} neq(){return this} gt(){return this} gte(){return this} lt(){return this} lte(){return this} like(){return this} ilike(){return this} is(){return this} in(){return this} contains(){return this} match(){return this} or(){return this} not(){return this} order(){return this} limit(){return this} range(){return this}
            insert(value){this._write=value;return this} upsert(value){this._write=value;return this} update(value){this._write=value;return this} delete(){this._write=[];return this}
            async maybeSingle(){return{data:this._rows[0]??null,error:null,count:this._rows.length}}
            async single(){return{data:this._rows[0]??this._write??null,error:null,count:this._rows.length}}
            then(resolve,reject){return Promise.resolve({data:this._rows,error:null,count:this._rows.length}).then(resolve,reject)}
          }
          export function fixtureClient(){return{
            auth:{getUser:async()=>({data:{user:fixtureUser},error:null}),getSession:async()=>({data:{session:{user:fixtureUser,access_token:'fixture'}},error:null}),refreshSession:async()=>({data:{session:{user:fixtureUser}},error:null}),signOut:async()=>({error:null})},
            from:(table)=>new Query(table),
            rpc:async()=>({data:[],error:null}),
            storage:{from:()=>({createSignedUrl:async()=>({data:{signedUrl:'/laneriq-future-city-people.webp'},error:null}),upload:async()=>({data:{path:'fixture'},error:null})})}
          }}
          `);
          fs.writeFileSync('lib/supabase/server.js', `import { fixtureClient } from './screenshot-fixture.js';\nexport async function createClient(){ return fixtureClient(); }\nexport { createClient as createServerClient };\n`);
          fs.writeFileSync('lib/supabase/admin.js', `import { fixtureClient } from './screenshot-fixture.js';\nexport function createAdminClient(){ return fixtureClient(); }\n`);
          fs.writeFileSync('lib/supabase/client.js', `import { fixtureClient } from './screenshot-fixture.js';\nexport function createClient(){ return fixtureClient(); }\n`);
          NODE
      - name: Start exact-SHA app locally
        env:
          LANERIQ_SCREENSHOT_FIXTURE: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://fixture.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'fixture-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'fixture-service-key'
          LANERIQ_SESSION_SECRET: 'fixture-session-secret-at-least-32-characters-long'
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/laneriq-screenshot.log 2>&1 &
          echo $! > /tmp/laneriq-screenshot.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laneriq-screenshot.log
          exit 1
      - name: Capture all 18 LIUI pages
        run: |
          mkdir -p screenshots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const APP='11111111-1111-4111-8111-111111111111';
          const routes=[
            ['01-home','/'],
            ['02-create-project','/create'],
            ['03-build-progress','/create?flow=build-progress'],
            ['04-preview',`/preview/${APP}`],
            ['05-launch',`/release/${APP}`],
            ['06-manage-grow',`/app-dashboard/${APP}`],
            ['07-my-projects','/my-apps'],
            ['08-templates','/templates'],
            ['09-ai-assistant','/soolen-ai'],
            ['10-automation',`/workflows/${APP}?view=overview`],
            ['11-analytics-growth',`/analytics/${APP}`],
            ['12-more-settings','/studio'],
            ['13-project-ai-editor',`/editor/${APP}`],
            ['14-template-detail','/templates/real-estate-crm'],
            ['15-workflow-editor',`/workflows/${APP}?view=editor`],
            ['16-database-manager',`/database/${APP}`],
            ['17-ai-testing-self-heal',`/operations/${APP}`],
            ['18-publish-deployment-center',`/publish/${APP}`],
          ];
          const app={id:APP,name:'Skyline Realty AI',description:'Premium AI real-estate operating system for listings, clients, appointments and follow-up.',current_version_id:'22222222-2222-4222-8222-222222222222',status:'ready',publish_status:'draft'};
          const dimensions=['stability','security','privacy','comfort','beauty','naturalness'].map(id=>({id,name:id,score:96,target:90}));
          const quality={releaseReady:true,target:90,report:{overall:96,dimensions},note:'Fixture data for exact-SHA visual QA only.',productionEvidence:[{key:'browser',label:'Browser visual review'},{key:'device',label:'Physical-device evidence remains separate'}]};
          const workflows=[{id:'33333333-3333-4333-8333-333333333333',app_id:APP,name:'New enquiry follow-up',description:'Qualify a new property enquiry and prepare the next best action.',trigger_type:'new_enquiry',enabled:true,is_active:true,status:'active',actions:[{type:'ai_prepare_follow_up'}]}];
          const runs=[{id:'44444444-4444-4444-8444-444444444444',workflow_id:workflows[0].id,status:'success',started_at:new Date().toISOString()}];
          const templates=[{id:'real-estate-crm',name:'Real Estate CRM',description:'Leads, properties, follow-ups and appointments',industry:'Real Estate',features:['Listings','Clients','Appointments','AI Follow-Up']}];
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'});
          const page=await context.newPage();
          const consoleErrors=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          await page.route('**/api/**',async route=>{
            const req=route.request(); const u=new URL(req.url()); const p=u.pathname;
            let body={success:true,authenticated:true,sessionAuthority:'laneriq',user:{id:'00000000-0000-4000-8000-000000000001',email:'owner@laneriq.local'},app,apps:[app],project:app,projects:[app],templates,workflows,runs,quality,report:quality.report,releaseReady:true,data:[]};
            if(p==='/api/auth/session') body={success:true,authenticated:true,sessionAuthority:'laneriq',user:body.user};
            else if(/\/quality$/.test(p)) body=quality;
            else if(p.includes('/workflows')) body={success:true,workflows,runs,workflow:workflows[0],data:workflows};
            else if(p.includes('/analytics')) body={success:true,summary:{views:12840,users:4280,leads:316,conversionRate:7.4},events:[],data:[]};
            else if(p.includes('/templates')) body={success:true,templates,template:templates[0],data:templates};
            else if(/^\/api\/apps\/[^/]+$/.test(p)) body={success:true,app};
            else if(p==='/api/apps'||p==='/api/my-apps') body={success:true,apps:[app],projects:[app]};
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
          });
          const manifest=[];
          for(const [name,path] of routes){
            let status='ok',title='',finalUrl='';
            try{
              const response=await page.goto(`http://127.0.0.1:3000${path}`,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(1800);
              title=await page.title(); finalUrl=page.url();
              await page.screenshot({path:`screenshots/${name}.png`,fullPage:true});
              status=String(response?.status()||'client');
            }catch(error){
              status=`error: ${error.message}`;
              try{await page.screenshot({path:`screenshots/${name}-error.png`,fullPage:true})}catch{}
            }
            manifest.push({name,path,status,title,finalUrl});
          }
          fs.writeFileSync('screenshots/manifest.json',JSON.stringify({sourceSha:process.env.GITHUB_SHA,viewport:'390x844 iPhone-class',fixture:true,routes:manifest,consoleErrors},null,2));
          await browser.close();
          console.log(JSON.stringify(manifest,null,2));
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/laneriq-screenshot.log || true
      - name: Upload 18-page screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: laneriq-18-page-screenshots-${{ github.event.pull_request.head.sha }}
          path: screenshots
          if-no-files-found: error
          retention-days: 3
