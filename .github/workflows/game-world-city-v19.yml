name: Game World City V19 Gate
on:
  push:
    branches: [batch179-game-world-city-v19]
  pull_request:
    paths:
      - 'lib/game/game-world-city-v19.js'
      - 'scripts/game-world-city-v19-tests.mjs'
      - '.github/workflows/game-world-city-v19.yml'
jobs:
  city-v19:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/game-world-interior-v18-tests.mjs
      - run: node scripts/game-world-city-v19-tests.mjs
