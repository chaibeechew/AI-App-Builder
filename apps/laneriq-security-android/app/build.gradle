plugins { id 'com.android.application' }

android {
    namespace 'ai.laneriq.security'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.laneriq.security.test'
        minSdk 26
        targetSdk 35
        versionCode 1001
        versionName '0.1.0-antiscam-test.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
